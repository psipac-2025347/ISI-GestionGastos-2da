<section class="resumen-header">
  <h2>RESUMEN</h2>
</section>
<div class="summary-cards">
  <div class="summary-card">
    <div class="card-icon-wrap">
      <img src="/images/icons/sueldo-fijo.png" alt="" class="card-icon" />
    </div>
    <div class="card-text">
      <p class="card-label">SUELDO FIJO</p>
      <p class="card-value">Q {{ sueldoFijo.toFixed(2) }}</p>
      <p class="card-status"><span class="dot"></span>Disponible</p>
    </div>
  </div>
  <div class="summary-card">
    <div class="card-icon-wrap">
      <img src="/images/icons/Ingreso-Variable.png" alt="" class="card-icon" />
    </div>
    <div class="card-text">
      <p class="card-label">SUELDO VARIABLE</p>
      <p class="card-value">Q {{ sueldoVariable.toFixed(2) }}</p>
      <p class="card-status"><span class="dot"></span>Disponible</p>
    </div>
  </div>
  <div class="summary-card">
    <div class="card-icon-wrap">
      <img src="/images/icons/sueldo-extra.png" alt="" class="card-icon" />
    </div>
    <div class="card-text">
      <p class="card-label">INGRESOS EXTRA</p>
      <p class="card-value">Q {{ ingresosExtra.toFixed(2) }}</p>
      <p class="card-status"><span class="dot"></span>Disponible</p>
    </div>
  </div>
</div>
