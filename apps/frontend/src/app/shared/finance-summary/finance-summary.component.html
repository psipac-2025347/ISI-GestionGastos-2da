<section class="resumen-header">
  <h2>RESUMEN</h2>
</section>
<div class="summary-cards">
  <div class="summary-card">
    <p class="card-label">SUELDO FIJO</p>
    <p class="card-value">Q {{ sueldoFijo.toFixed(2) }}</p>
  </div>
  <div class="summary-card">
    <p class="card-label">SUELDO VARIABLE</p>
    <p class="card-value">Q {{ sueldoVariable.toFixed(2) }}</p>
  </div>
  <div class="summary-card">
    <p class="card-label">INGRESOS EXTRA</p>
    <p class="card-value">Q {{ ingresosExtra.toFixed(2) }}</p>
  </div>
</div>
